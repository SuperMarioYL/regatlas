name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke the offline pipeline
        run: |
          regatlas --version
          regatlas run --suite suites/toolcalling.yaml --models opus-4,opus-5 --recordings tests/fixtures
          regatlas diff --baseline opus-4 --candidate opus-5 --out diff.json
          regatlas report --diff diff.json
